<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Debugging Exercise</title>
</head>
<body>
    <h1>Dashboard Status</h1>
    <div id="display"></div>
 
    <script>
        // Weekly Goal: Calculate the total weekly task goal for a user.
        
        // Declare variables and values
        let userName = "Jane Doe";
        let dailyGoal = 5; 
        let bonusTasks = Number("2"); // Fixed: converted bonusTasks from a string to a number. 
 
        // Output message to console
        console.log("Checking status for: " + userName);

        // Calculate weekly goal based on number of workdays (5) per week
        let weeklyGoal = dailyGoal * 5; // Fixed: changed the multiplier from 15 to 5 workdays.

        // Add bonusTasks to weeklyGoal.
        // Note: Check for data type issues
        let totalGoal = weeklyGoal + bonusTasks; // Fixed: changed the subtraction operator (-) to addition (+).
 
        // Output results to web page
        document.write("User: " + userName + "<br>");
       document.write("Total Weekly Goal: " + totalGoal); // Fixed: moved totalGoal outside the quotation marks so its value is displayed.
 
    </script>
</body>
</html>
